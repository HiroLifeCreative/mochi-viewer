<!--
  Visor del personaje Mochi (Coucou · Louis Raillé) — SOLO PARA VER.
  Reutiliza el prototipo de animación de saludo del propio repo
  (design/animations/greeting-v2.html), dibujando únicamente el personaje.
  El personaje NO es reutilizable: ver LICENSE-ASSETS.md del repo.
-->
<style>
  .mv-wrap{box-sizing:border-box;max-width:430px;margin:0 auto;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .mv-head{margin-bottom:10px;}
  .mv-title{font-size:16px;font-weight:800;color:var(--hatch-widget-text);}
  .mv-sub{font-size:12.5px;color:var(--hatch-widget-muted);margin-top:2px;line-height:1.45;}
  .mv-stage{border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 110%,#2b2e52 0%,#141524 70%);
    border:1px solid var(--hatch-widget-border);}
  .mv-stage canvas{display:block;width:100%;height:auto;}
  .mv-bar{display:flex;gap:8px;align-items:center;margin-top:10px;}
  .mv-bar button{border:1px solid var(--hatch-widget-border);background:var(--hatch-widget-surface);
    color:var(--hatch-widget-text);border-radius:999px;padding:7px 14px;font-size:13px;
    font-weight:700;cursor:pointer;}
  .mv-bar button:active{transform:scale(.95);}
  .mv-t{font-size:12px;color:var(--hatch-widget-muted);font-family:ui-monospace,Menlo,monospace;}
  .mv-credit{font-size:11.5px;color:var(--hatch-widget-muted);margin-top:10px;line-height:1.5;}
  .mv-credit a{color:var(--hatch-widget-accent);}
</style>
<div class="mv-wrap">
  <div class="mv-head">
    <div class="mv-title">Mochi · vista del personaje</div>
    <div class="mv-sub">Personaje de <b>Coucou</b> por Louis Raillé — usado con su permiso escrito · proyecto personal sin fines comerciales</div>
  </div>
  <div class="mv-stage"><canvas id="mvc" width="480" height="420"></canvas></div>
  <div class="mv-bar">
    <button id="mvReplay">Reiniciar</button>
    <button id="mvPause">Pausar</button>
    <span class="mv-t" id="mvPhase"></span>
  </div>
  <div class="mv-credit">Mochi © 2026 Louis Raillé · <a href="https://github.com/Louis-CFM/coucou">Coucou en GitHub</a> · Usado con permiso escrito del autor · Proyecto personal sin fines comerciales</div>
</div>
<script>
(()=>{
"use strict";
/* ===== Constantes y utilidades del prototipo original ===== */
const W=640, H=220, CX=320;
const NOTCH={w:184,h:32};
const BIG={w:640,h:150};
const C0={x:320,y:90};
const HB=58;
const ASPECT=1.34;
const T={grow:.45, squint0:.60, squint1:.82, dip0:1.25, dip1:1.40, pop0:1.36, pop1:1.52, waveEnd:2.45, content0:2.45, content1:2.58,
  tuck0:2.58, tuck1:2.80, badge:2.72, down0:2.85, down1:3.20, blink2:3.80, tint0:3.85, tint1:4.15, end:4.60, autoLeave:4.90};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const E={out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}};
/* ===== Pose del saludo en el instante t (del prototipo) ===== */
function greetPose(t){
  const p={};
  const gx=seg(t,0,.5), g=Math.sin(Math.PI*gx/2)+.04*Math.sin(Math.PI*gx)*gx;
  p.iw=lerp(NOTCH.w,BIG.w,g); p.ih=lerp(NOTCH.h,BIG.h,g); p.ir=lerp(12,30,clamp(g,0,1)); p.header=seg(t,.35,.6); p.card=seg(t,.18,.45);
  const gg=E.back(seg(t,.02,T.grow)); p.hb=lerp(3,HB,gg); p.x=C0.x; p.y=lerp(16,C0.y,E.out(seg(t,.02,T.grow)));
  p.sx=1; p.sy=1; p.tilt=0;
  if(t>=T.dip0&&t<T.pop1){ const k=Math.sin(Math.PI*seg(t,T.dip0,T.pop1)); p.y+=p.hb*.22*k; p.sy=1-.06*k; p.sx=1+.04*k }
  if(t>=T.pop1&&t<T.tuck1){ const w=t-T.pop1, fade=1-seg(t,T.tuck0,T.tuck1); p.x+=Math.sin(w*2*Math.PI*.9)*p.hb*ASPECT*.05*fade; p.tilt=(Math.sin(w*2*Math.PI*.9+.6)*.05)*fade; p.y+=Math.sin(w*2*Math.PI*1.8)*.8*fade }
  if(t>=T.tuck0&&t<T.down1){ const k=Math.sin(Math.PI*seg(t,T.tuck0,T.down1)); p.y+=p.hb*.12*k }
  p.eye='dot'; p.open=1; p.eyeRoll=0;
  if(t>=T.squint0&&t<T.squint1) p.eye='happy';
  if(t>=T.content0&&t<T.content1) p.eye='content';
  if(t>=T.down0&&t<T.down1) p.eye='content';
  if(t>=T.dip0&&t<T.pop1){ p.eyeRoll=Math.sin(Math.PI*seg(t,T.dip0,T.pop1)) }
  const blink=tb=>{ const k=seg(t,tb,tb+.12); return k>0&&k<1?1-Math.sin(Math.PI*k)*.94:1 }; p.open=Math.min(blink(1.95),blink(T.blink2));
  p.lookX=0; p.lookY=0;
  if(t>=T.squint1&&t<T.dip0){ p.lookY=-.2 }
  if(t>=T.pop1&&t<T.content0){ p.lookX=.55; p.lookY=-.45 }
  if(t>=T.content0&&t<T.down1){ p.lookX=-.3; p.lookY=.6 }
  if(t>=T.down1){ const k=E.inOut(seg(t,T.down1,T.down1+.35)); p.lookX=lerp(-.3,0,k); p.lookY=lerp(.6,0,k) }
  p.handL=t<T.tuck0?E.back(seg(t,T.pop0,T.pop0+.14)):1-E.in(seg(t,T.tuck0,T.tuck1-.03));
  p.handR=t<T.tuck0?E.back(seg(t,T.pop0+.04,T.pop0+.18)):1-E.in(seg(t,T.tuck0+.03,T.tuck1));
  p.wave=t>=T.pop1&&t<T.tuck0?(t-T.pop1):-1;
  p.badge=E.back(seg(t,T.badge,T.badge+.28)); p.tint=.6*E.inOut(seg(t,T.tint0,T.tint1));
  p.halo=E.out(seg(t,.3,.7)); p.haloBlue=seg(t,T.tint0,T.tint1);
  p.minis=0;
  return p;
}
/* ===== Dibujo del personaje (del prototipo) ===== */
const cv=document.getElementById('mvc'), X=cv.getContext('2d');
const VW=480, VH=420;
function rr(a,b,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));X.beginPath();X.moveTo(a+r,b);X.arcTo(a+w,b,a+w,b+h,r);X.arcTo(a+w,b+h,a,b+h,r);X.arcTo(a,b+h,a,b,r);X.arcTo(a,b,a+w,b,r);X.closePath()}
function mochiPath(hw,hh){ const n=3.2, p=new Path2D(); for(let i=0;i<=96;i++){ const a=i/96*Math.PI*2, ca=Math.cos(a), sa=Math.sin(a); const px=hw*Math.sign(ca)*Math.pow(Math.abs(ca),2/n), py=hh*Math.sign(sa)*Math.pow(Math.abs(sa),2/n); i?p.lineTo(px,py):p.moveTo(px,py) } p.closePath(); return p }
const WHITE0='#FBFBFC', WHITE1='#E7E9EC';
function whiteFill(x0,y0,x1,y1){ const g=X.createLinearGradient(x0,y0,x1,y1); g.addColorStop(0,WHITE0); g.addColorStop(1,WHITE1); return g }
function drawHandL(p,hw,hh){
  const k=p.handL; if(k<=.01) return; const hb=hh*2, r=hb*.15*k;
  const rest={x:-hw-hb*.22, y:hh*.62}, hide={x:-hw*.35, y:hh*.85};
  let x=lerp(hide.x,rest.x,k), y=lerp(hide.y,rest.y,k);
  if(p.wave>=0) y+=Math.sin(p.wave*6)*hb*.02;
  X.save(); X.translate(x,y); X.fillStyle=whiteFill(r,-r,-r,r); X.beginPath(); X.arc(0,0,r,0,Math.PI*2); X.fill();
  X.strokeStyle='rgba(0,0,0,.08)'; X.lineWidth=.8; X.stroke(); X.restore() }
function drawHandR(p,hw,hh){
  const k=p.handR; if(k<=.01) return; const hb=hh*2, L=hb*.40*k, T2=hb*.22*k;
  const rest={x:hw+hb*.20, y:hh*.20}, hide={x:hw*.35, y:hh*.85};
  let x=lerp(hide.x,rest.x,k), y=lerp(hide.y,rest.y,k), ang=-0.61;
  if(p.wave>=0){ const w=p.wave*2*Math.PI*2.5; ang+=Math.sin(w)*.21; y+=Math.sin(w+.8)*hb*.04; x+=Math.cos(w)*hb*.015 }
  X.save(); X.translate(x,y); X.rotate(ang); X.fillStyle=whiteFill(L/2,-T2/2,-L/2,T2/2); rr(-L/2,-T2/2,L,T2,T2/2); X.fill();
  X.strokeStyle='rgba(0,0,0,.08)'; X.lineWidth=.8; X.stroke(); X.restore() }
function drawMochi(p){
  const hh=p.hb/2, hw=hh*ASPECT; if(hh<.4) return;
  if(p.halo>0){ const c=[lerp(232,59,p.haloBlue),lerp(195,158,p.haloBlue),lerp(154,255,p.haloBlue)].map(v=>v|0); const R=hw*2.4; const hg=X.createRadialGradient(p.x,p.y,hh*.3,p.x,p.y,R); hg.addColorStop(0,`rgba(${c},${.36*p.halo})`); hg.addColorStop(1,`rgba(${c},0)`); X.fillStyle=hg; X.beginPath(); X.arc(p.x,p.y,R,0,Math.PI*2); X.fill() }
  X.save(); X.translate(p.x,p.y); X.rotate(p.tilt); X.scale(p.sx,p.sy);
  drawHandL(p,hw,hh); drawHandR(p,hw,hh);
  const path=mochiPath(hw,hh);
  X.fillStyle=whiteFill(hw*.6,-hh,-hw*.6,hh); X.fill(path);
  if(p.tint>0){ const tg=X.createLinearGradient(0,hh,0,-hh*.1); tg.addColorStop(0,`rgba(127,180,234,${p.tint})`); tg.addColorStop(1,'rgba(127,180,234,0)'); X.fillStyle=tg; X.fill(path) }
  X.save(); X.clip(path); X.fillStyle='#16171A'; X.strokeStyle='#16171A';
  const er=p.hb*.06, sp=p.hb*.19, lx=p.lookX*hw*.42, ly=p.lookY*hh*.28+hh*.12+p.eyeRoll*hh*1.25;
  for(const sd of[-1,1]){ X.save(); X.translate(sd*sp+lx,ly);
    if(p.eye==='happy'||p.eye==='content'){ X.lineWidth=er*.95; X.lineCap='round'; X.beginPath(); if(p.eye==='happy') X.arc(0,er*.6,er*1.25,Math.PI*1.15,Math.PI*1.85); else X.arc(0,-er*.5,er*1.25,Math.PI*.15,Math.PI*.85); X.stroke() }
    else { X.scale(1,Math.max(.12,p.open)); X.beginPath(); X.arc(0,0,er,0,Math.PI*2); X.fill() }
    X.restore() }
  X.restore();
  if(p.badge>.01){ X.save(); X.translate(-hw*.78,-hh*.72); X.scale(p.badge,p.badge); const br=hh*.3; X.fillStyle='#000'; X.beginPath(); X.arc(0,0,br+hh*.07,0,Math.PI*2); X.fill(); X.fillStyle='#3BA0F5'; X.beginPath(); X.arc(0,0,br,0,Math.PI*2); X.fill();
    for(let i=0;i<3;i++){ X.fillStyle='#0B1B3A'; X.beginPath(); X.arc((i-1)*br*.5,0,br*.17,0,Math.PI*2); X.fill() } X.restore() }
  X.restore() }
/* ===== Visor: solo el muñeco, centrado ===== */
function phaseName(t){
  if(t<T.grow)return 'sale del notch';
  if(t<T.dip0)return 'ojos de alegría, te mira';
  if(t<T.pop1)return 'se inclina, salen las manos';
  if(t<T.tuck0)return '¡coucou! saluda con la mano';
  if(t<T.down1)return 'guarda las manos, aparece el badge';
  if(t<T.end)return 'parpadea, se queda contento';
  return 'fin';
}
function drawViewer(t){
  const p=greetPose(Math.min(t,T.end));
  X.setTransform(1,0,0,1,0,0);
  X.clearRect(0,0,VW,VH);
  X.save();
  X.translate(VW/2, VH*0.60);
  const s=2.7; X.scale(s,s);
  X.translate(-p.x,-p.y);
  drawMochi(p);
  X.restore();
  document.getElementById('mvPhase').textContent='t = '+t.toFixed(2)+' s · '+phaseName(t);
}
let t=0, playing=true, last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(playing){ t+=dt; if(t>T.end+.8) t=0; }
  drawViewer(t);
  requestAnimationFrame(loop);
}
document.getElementById('mvReplay').onclick=()=>{ t=0; playing=true;
  document.getElementById('mvPause').textContent='Pausar'; };
document.getElementById('mvPause').onclick=function(){ playing=!playing; this.textContent=playing?'Pausar':'Seguir'; };
requestAnimationFrame(loop);
})();
</script>
